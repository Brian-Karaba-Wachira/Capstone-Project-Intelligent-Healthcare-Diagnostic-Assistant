[package]
name = "lmodel"
version = "0.1.0"
edition = "2024"

[dependencies]
monoio     = { version = "0.2.4", features = ["macros", "utils", "sync"] }
monoio-rustls = "0.4.0"
rustls     = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.0"
webpki-roots = "0.26"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes      = "1.5"
thiserror  = "2.0"
clap       = { version = "4.5", features = ["derive"] }
uuid       = { version = "1.8", features = ["v4", "fast-rng"] }
ureq       = { version = "2.9", features = ["json"] }
url        = "2.5"
flume      = "0.11"
log        = "0.4"
env_logger = "0.11"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
